# deploy/nginx-redirects.conf — BDPM Site Services (bdpm-site-services)
#
# 301 redirects for the two auto-written blog posts that were removed on 2026-10-20 (pending client-approved
# articles). Both URLs now point at the /blog/ "Articles are coming soon" placeholder, with and without the
# trailing slash, so any link or crawler that already saw them lands on a live page instead of a 404.
#
# HOW TO USE: include this file inside the production `server { ... }` block for the site, e.g.
#
#   server {
#       server_name bdpmsiteservices.com www.bdpmsiteservices.com;
#       ...
#       include /path/to/site/deploy/nginx-redirects.conf;
#       ...
#   }
#
# then `nginx -t && systemctl reload nginx`. The `location = ...` exact matches take precedence over the
# site's generic PHP / try_files locations, so no ordering inside the server block is required.
# (Apache/Hostinger deployments do not read this file; add equivalent `Redirect 301` lines to .htaccess there.)

location = /blog/what-drives-excavation-cost-plymouth-ma  { return 301 /blog/; }
location = /blog/what-drives-excavation-cost-plymouth-ma/ { return 301 /blog/; }
location = /blog/nor-easter-season-plymouth-coastal-bank  { return 301 /blog/; }
location = /blog/nor-easter-season-plymouth-coastal-bank/ { return 301 /blog/; }
